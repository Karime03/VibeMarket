    <circle cx="20" cy="20" r="18.5" fill="none" stroke="#2F4A3A" stroke-width="1.5"/>
    <path d="M12 14 L20 29 L28 14" fill="none" stroke="#2F4A3A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="10.5" r="2.4" fill="#B8643F"/>
  </g>
  <!-- Logotipo -->
  <text x="54" y="32" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="500" fill="#1F2421" letter-spacing="-0.3">Vibe</text>
  <text x="105" y="32" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="300" fill="#2F4A3A" letter-spacing="0.5">Market</text>
